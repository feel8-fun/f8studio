[workspace]
authors = ["sis92 <feel8.fun@gmail.com>"]
channels = ["conda-forge"]
name = "f8studio-workspace"
version = "0.4.0"
description = "Feel8 source development and integration workspace"
# Keep the supported Linux deployment baseline explicit in the platform definition.
platforms = ["win-64", { name = "linux-glibc228", platform = "linux-64", glibc = "2.28" }]
preview = ["pixi-build"]

[feature.python.dependencies]
python = ">=3.14.3,<3.15"
pip = ">=26.0.1,<27"

[feature.vision.pypi-dependencies]
numpy = ">=2.4.2, <3"
opencv-contrib-python-headless = ">=4.13.0.92, <5"

[feature.debug.pypi-dependencies]
scapy = ">=2.6.1,<3"

[feature.debug.tasks]
udp_pcap_replay = "python scripts/udp_pcap_replay.py"

[feature.pydl.pypi-dependencies]
f8pydl = { path = "extensions/f8pydl", editable = true }

[feature.sdk.pypi-dependencies]
f8pysdk = { path = "sdk/python", editable = true }
eclipse-zenoh = ">=1.9.0,<1.10"

[feature.sdk.tasks]
workspace_catalog = { cmd = "python scripts/extension_workspace.py sync", default-environment = "workspace", description = "Generate development registrations from extension declarations" }
workspace_prepare = { cmd = "python scripts/workspace_inputs.py prepare", depends-on = [{ task = "workspace_catalog", environment = "workspace" }], description = "Prepare library checkout inputs and development registrations", default-environment = "workspace" }
install_services = { cmd = "python scripts/install_services.py --index build/workspace/config/service-index.json", depends-on = ["workspace_prepare"], description = "Prepare extension environments and missing service descriptions" }
update_describes = { cmd = "python scripts/install_services.py --index build/workspace/config/service-index.json --refresh", depends-on = ["workspace_prepare"], description = "Refresh descriptions using each extension's own environment" }
workspace_native_describes = { cmd = "python scripts/install_services.py --index build/workspace/config/service-index.json --native-only --no-install --refresh", depends-on = ["workspace_catalog"], description = "Refresh native descriptions after compiling service binaries" }
protocol_codegen_py = "pixi run --locked --manifest-path sdk/pixi.toml codegen_py"
protocol_codegen_cpp = "pixi run --locked --manifest-path sdk/pixi.toml codegen_cpp"

[feature.test.dependencies]
pytest = ">=8.4.2,<9"

[feature.test.pypi-dependencies]
ruff = ">=0.12.0,<0.13"
import-linter = ">=2.11,<3"

[feature.test.tasks]
pytest = { cmd = "python -m pytest", depends-on = ["workspace_catalog"] }
pytest_sdk = "pixi run --locked --manifest-path sdk/pixi.toml test"
workspace_python_describes = { cmd = "pixi run --locked -e build-check python scripts/install_services.py --index build/workspace/config/service-index.json --python-only --build-check --no-install --refresh", depends-on = ["workspace_catalog"], description = "Generate Python descriptions using the integration test environment" }
protocol_codegen_all = "pixi run --locked --manifest-path sdk/pixi.toml codegen && python scripts/web_studio/generate_contracts.py"
contracts_check = "python scripts/web_studio/generate_contracts.py --check"
# Keep the initial repo-level static guards narrow and green. We can widen the
# checked surface incrementally as more packages are annotated and cleaned up.
lint = "ruff check extensions/f8webstudio/f8studio_core/f8studio_core sdk/python/f8media_protocol extensions/f8mediagateway/f8media_gateway extensions/f8webstudio/f8studio_server/f8studio_server"
extensions_check = { cmd = "python scripts/extension_workspace.py check", depends-on = ["workspace_catalog"] }
typecheck = "basedpyright -p pyrightconfig.web-studio.json"
quality_exceptions = "python scripts/quality/except_metrics.py platform extensions --exclude-glob '**/tests/**' --exclude-glob 'f8unitymods/**' --max-broad 110 --max-silent 0"
lint_imports = "lint-imports --cache-dir build/cache/imports"

[feature.audio.pypi-dependencies]
librosa = ">=0.11.0, <0.12"
f8pyaudiofeat = { path = "extensions/f8pyaudiofeat", editable = true }

[feature.engine.pypi-dependencies]
f8diagnostics = { path = "extensions/f8diagnostics", editable = true }
scipy = ">=1.17.1,<2"
scikit-learn = ">=1.8.0,<2"
f8pyengine = { path = "extensions/f8pyengine", editable = true }
f8proclauncher = { path = "extensions/f8proclauncher", editable = true }

[feature.doc.pypi-dependencies]
zensical = ">=0.0.23,<0.1.0"
pyyaml = ">=6.0.3,<7"
mkdocs-static-i18n = ">=1.2.3,<2"

[feature.doc.tasks]
# Inventory generation uses the SDK and generated integration catalog; the doc
# environment remains dedicated to the static site renderer.
doc_gen = "pixi run --locked -e build-check workspace_catalog && pixi run --locked -e build-check python scripts/generate_service_docs.py && pixi run --locked -e build-check python scripts/generate_node_atlas.py"
doc_build = "zensical build"
doc_serve = "python scripts/zensical_serve_pretty.py"
doc_serve_raw = "zensical serve"
doc_check = "pixi run --locked -e build-check workspace_catalog && pixi run --locked -e build-check python scripts/generate_service_docs.py --check && pixi run --locked -e build-check python scripts/generate_node_atlas.py --check && python scripts/check_docs_nav.py && python scripts/check_docs_links.py"

[feature.cpp.dependencies]
pip = ">=26.0.1,<27"
conan = ">=2.23.0,<3"
cmake = ">=3.30,<5"
ninja = ">=1.13.0,<2"
pkg-config = ">=0.29,<1"
libzenohc = ">=1.9.0,<1.10"
libzenohcxx = ">=1.9.0,<1.10"
sdl3 = ">=3.2,<4"
yt-dlp = ">=2025.8,<2027"
gtest = ">=1.17.0,<2"

[feature.cpp.target.linux-64.dependencies]
gxx_linux-64 = ">=11,<12"
mpv = ">=0.39,<1"
libgl-devel = ">=1.7,<2"
libegl-devel = ">=1.7,<2"
libudev = ">=257,<261"
expat = ">=2.6,<3"
freetype = ">=2.13,<3"
zlib = ">=1.3,<2"
xorg-libx11 = ">=1.8,<2"
xorg-libxext = ">=1.3,<2"
xorg-libxfixes = ">=6,<7"
xorg-libxinerama = ">=1.1,<2"
xorg-libxrandr = ">=1.5,<2"
xorg-libxcursor = ">=1.2,<2"

[feature.cpp.tasks]
cpp_lock_refresh = "python scripts/cpp_ci.py lock-refresh"
cpp_bootstrap = "python scripts/cpp_ci.py bootstrap"
cpp_configure_release = "python scripts/cpp_ci.py configure"
cpp_build_release = "python scripts/cpp_ci.py build"
cpp_test_release = "python scripts/cpp_ci.py test"
cpp_bench_latest_video = "python scripts/cpp_ci.py configure && python scripts/cpp_ci.py run-target f8cpp_bench_latest_video_transport"

[feature.ci.dependencies]
hatchling = ">=1.28.0,<2"
msgspec = ">=0.18.6,<1"

[feature.ci.tasks]
workspace_snapshot = { cmd = "pixi run --locked -e build-check workspace_catalog && pixi run --locked -e build-check python scripts/workspace_ci.py", description = "Build a local integration snapshot; official assembly belongs to f8distribution" }
workspace_clean = "python scripts/workspace_clean.py"

# Root entrypoints only coordinate checkout inputs. Launcher runs in its own lock.
[tasks]
platform_ensure = { cmd = "pixi run --locked --manifest-path platform/pixi.toml -e platform-runtime python scripts/platform_workspace.py ensure", depends-on = [{ task = "workspace_prepare", environment = "workspace" }], default-environment = "workspace", description = "Ensure Launcher is running in its own headless environment" }
platform_dev = { cmd = "pixi run --locked --manifest-path platform/pixi.toml -e platform-runtime python scripts/platform_workspace.py serve", depends-on = [{ task = "workspace_prepare", environment = "workspace" }], default-environment = "workspace", description = "Run Launcher and its portal in the Launcher environment" }
platform_tray = { cmd = "pixi run --locked --manifest-path platform/pixi.toml -e platform-desktop python scripts/platform_workspace.py tray", depends-on = [{ task = "workspace_prepare", environment = "workspace" }], default-environment = "workspace", description = "Run the tray and portal in Launcher's desktop environment" }
platform_open = { cmd = "pixi run --locked --manifest-path platform/pixi.toml -e platform-runtime python scripts/platform_workspace.py open", depends-on = [{ task = "workspace_prepare", environment = "workspace" }], default-environment = "workspace" }
platform_stop = { cmd = "pixi run --locked --manifest-path platform/pixi.toml -e platform-runtime python scripts/platform_workspace.py stop", depends-on = [{ task = "workspace_prepare", environment = "workspace" }], default-environment = "workspace" }
platform_cli = { cmd = "pixi run --locked --manifest-path platform/pixi.toml -e platform-runtime python scripts/platform_workspace.py cli", depends-on = [{ task = "workspace_prepare", environment = "workspace" }], default-environment = "workspace" }

# Integration tests import Launcher; WebStudio's development runtime does not.
[feature.platform.pypi-dependencies]
f8platform = { path = "platform", editable = true }

[feature.platform-desktop.pypi-dependencies]
pystray = ">=0.19.5,<0.20"
pillow = ">=11,<13"

[feature.platform-desktop.target.linux-64.dependencies]
pygobject = ">=3.50,<4"
gtk3 = ">=3.24,<4"

[feature.web-studio.pypi-dependencies]
f8studio-core = { path = "extensions/f8webstudio/f8studio_core", editable = true }
f8media-gateway = { path = "extensions/f8mediagateway", editable = true }
f8studio-server = { path = "extensions/f8webstudio/f8studio_server", editable = true }
f8unitymods-setup = { path = "extensions/f8unitymods", editable = true }
aiortc = ">=1.14,<2"
basedpyright = ">=1.31,<2"
python-xlib = ">=0.33,<1"
httpx = ">=0.28,<1"
agent-framework-core = ">=1.7,<2"
agent-framework-openai = ">=1.7,<2"
agent-framework-anthropic = ">=1.0.0b260521,<2"
mcp = { version = ">=1.24,<2", extras = ["cli"] }

[feature.web-studio.tasks]
studio_media_gateway = "python -m f8media_gateway"
studio_server = { cmd = "python -m f8studio_server", depends-on = ["platform_ensure"], env = { F8_SERVICE_INDEX = "build/workspace/config/service-index.json", F8_PLATFORM_CONNECTION_FILE = "build/workspace/platform-connection.json" }, description = "Run the development server in this terminal" }
studio_launch = { cmd = "python -m f8studio_server --open-browser", depends-on = ["platform_ensure"], env = { F8_SERVICE_INDEX = "build/workspace/config/service-index.json", F8_PLATFORM_CONNECTION_FILE = "build/workspace/platform-connection.json" }, description = "Run the development server and open its browser page" }
studio_cli = { cmd = "python -m f8studio_server.cli", description = "Connect the CLI to a running Studio server" }
studio_mcp = { cmd = "python -m f8studio_server.mcp_server", description = "Connect MCP to a running Studio server" }
studio_agent_model_smoke = "python scripts/web_studio/probe_agent_model.py"

[feature.web-studio-dev.dependencies]
nodejs = ">=24,<25"

[feature.web-studio-dev.tasks]
studio_web_dev = "npm --prefix extensions/f8webstudio/f8studio_web run dev"
studio_web_install = { cmd = "npm --prefix extensions/f8webstudio/f8studio_web ci", description = "Install frontend dependencies from the npm lock" }
studio_web_build = { cmd = "npm --prefix extensions/f8webstudio/f8studio_web run build", description = "Build WebStudio frontend assets; run studio_web_install on a fresh checkout" }

[feature.web-studio-test.dependencies]
pytest = ">=8.4.2,<9"
hatchling = ">=1.28,<2"

[feature.web-studio-test.pypi-dependencies]
httpx = ">=0.28,<1"
basedpyright = ">=1.31,<2"

[feature.web-studio-test.tasks]
studio_core_test = "python -m pytest -q extensions/f8webstudio/f8studio_core/tests"
studio_server_test = { cmd = "python -m pytest -q extensions/f8webstudio/f8studio_server/tests", depends-on = ["workspace_catalog"], env = { F8_SERVICE_INDEX = "build/workspace/config/service-index.json" } }
studio_media_gateway_test = "python -m pytest -q extensions/f8mediagateway/tests"
studio_web_test = "npm --prefix extensions/f8webstudio/f8studio_web run test"
studio_web_ci = "npm --prefix extensions/f8webstudio/f8studio_web ci && npm --prefix extensions/f8webstudio/f8studio_web run typecheck && npm --prefix extensions/f8webstudio/f8studio_web run test"
studio_web_typecheck = "npm --prefix extensions/f8webstudio/f8studio_web run typecheck"
studio_web_e2e = { cmd = "npm --prefix extensions/f8webstudio/f8studio_web run test:e2e", depends-on = ["studio_web_build"] }
studio_graph_bench = { cmd = "npm --prefix extensions/f8webstudio/f8studio_web run test:graph-performance", depends-on = ["studio_web_build"] }
studio_no_qt_check = { cmd = "python scripts/web_studio/check_no_qt.py", depends-on = ["platform_ensure"], env = { F8_SERVICE_INDEX = "build/workspace/config/service-index.json", F8_PLATFORM_CONNECTION_FILE = "build/workspace/platform-connection.json" } }
studio_dependency_probe = "python scripts/web_studio/probe_environment.py"
studio_runtime_probe = { cmd = "python scripts/web_studio/probe_real_runtime.py --base-url http://127.0.0.1:8210", description = "Probe PyEngine against an already running Studio server" }
studio_media_probe = "python scripts/web_studio/probe_webrtc_media.py"
studio_real_video_probe = "python scripts/web_studio/probe_real_video.py"
studio_media_bench = "python scripts/web_studio/benchmark_media.py"
studio_stream_restart_probe = "python scripts/web_studio/probe_stream_restart.py"
studio_p3_combined_bench = { cmd = "python scripts/web_studio/benchmark_p3_combined.py", depends-on = ["platform_ensure"], env = { F8_SERVICE_INDEX = "build/workspace/config/service-index.json", F8_PLATFORM_CONNECTION_FILE = "build/workspace/platform-connection.json" } }
studio_wheel_smoke = "python scripts/web_studio/verify_release_install.py"
unitymods_validate = "python scripts/unitymods_ci.py validate"
unitymods_contract = "python scripts/verify_skeleton_contract.py"

# Developer and CI workspaces only. Studio uses its extension workspace;
# extensions own their runtime definitions and locks.
[environments]
workspace = { features = ["python", "sdk"], solve-group = "workspace" }
build-check = { features = ["python", "sdk", "engine", "web-studio", "platform", "platform-desktop", "web-studio-dev", "web-studio-test", "vision", "audio", "test", "debug", "ci", "pydl"], solve-group = "build-check" }
# Root tasks serve development integration. Run individual services through
# their extension's manifest and explicitly select its environment.
default = { features = ["python", "sdk", "engine", "web-studio", "platform", "platform-desktop", "web-studio-dev", "vision", "audio", "test", "debug"], solve-group = "default" }
doc = { features = ["python", "doc"] }
cpp = { features = ["cpp"], solve-group = "cpp" }
ci = { features = ["python", "ci"], solve-group = "ci" }
web-studio = { features = ["python", "sdk", "web-studio", "web-studio-dev"], solve-group = "web-studio" }
web-studio-test = { features = ["python", "sdk", "engine", "web-studio", "platform", "platform-desktop", "web-studio-dev", "web-studio-test"], solve-group = "web-studio" }
