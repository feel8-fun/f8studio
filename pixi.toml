[workspace]
authors = ["sis92 <feel8.fun@gmail.com>"]
channels = ["conda-forge"]
name = "f8studio-workspace"
version = "0.4.0"
description = "Feel8 source development and integration workspace"
# Keep the supported Linux deployment baseline explicit in the platform definition.
platforms = ["win-64", { name = "linux-glibc228", platform = "linux-64", glibc = "2.28" }]
preview = ["pixi-build"]

[feature.python.dependencies]
python = ">=3.14.3,<3.15"
pip = ">=26.0.1,<27"

[feature.vision.pypi-dependencies]
numpy = ">=2.4.2, <3"
opencv-contrib-python-headless = ">=4.13.0.92, <5"

[feature.debug.pypi-dependencies]
scapy = ">=2.6.1,<3"

[feature.debug.tasks]
udp_pcap_replay = "python scripts/udp_pcap_replay.py"

[feature.pydl.pypi-dependencies]
f8pydl = { path = "extensions/f8pydl", editable = true }

[feature.pydl.tasks]
f8pydl_detector = "python -m f8pydl.main_detector"
f8pydl_humandetector = "python -m f8pydl.main_humandetector"
f8pydl_classifier = "python -m f8pydl.main_classifier"
f8pydl_optflow = "python -m f8pydl.main_optflow"
f8pydl_detsorter = "python -m f8pydl.main_detsorter"
f8pydl_tcnwave = "python -m f8pydl.main_tcnwave"
f8pydl_bench = "python scripts/bench_dl_baseline.py"

[feature.sdk.pypi-dependencies]
f8pysdk = { path = "sdk/python", editable = true }
eclipse-zenoh = ">=1.9.0,<1.10"

[feature.sdk.tasks]
workspace_catalog = "python scripts/extension_workspace.py sync"
workspace_prepare = { cmd = "python scripts/workspace_inputs.py prepare", depends-on = ["workspace_catalog"] }
install_services = { cmd = "python scripts/install_services.py", depends-on = ["workspace_catalog"] }
update_describes = { cmd = "python scripts/install_services.py --refresh", depends-on = ["workspace_catalog"] }
protocol_codegen_py = "pixi run --manifest-path sdk/pixi.toml codegen_py"
protocol_codegen_cpp = "pixi run --manifest-path sdk/pixi.toml codegen_cpp"
protocol_codegen_all = "pixi run --manifest-path sdk/pixi.toml codegen && python scripts/web_studio/generate_contracts.py"

[feature.test.dependencies]
pytest = ">=8.4.2,<9"

[feature.test.pypi-dependencies]
ruff = ">=0.12.0,<0.13"
import-linter = ">=2.11,<3"

[feature.test.tasks]
pytest = { cmd = "python -m pytest", depends-on = ["workspace_catalog"] }
pytest_sdk = "pixi run --manifest-path sdk/pixi.toml test"
# Keep the initial repo-level static guards narrow and green. We can widen the
# checked surface incrementally as more packages are annotated and cleaned up.
lint = "ruff check extensions/f8webstudio/f8studio_core/f8studio_core sdk/python/f8media_protocol extensions/f8mediagateway/f8media_gateway extensions/f8webstudio/f8studio_server/f8studio_server"
extensions_check = "python scripts/extension_workspace.py check"
typecheck = "basedpyright -p pyrightconfig.web-studio.json"
quality_exceptions = "python scripts/quality/except_metrics.py launcher extensions --exclude-glob '**/tests/**' --exclude-glob 'f8unitymods/**' --max-broad 110 --max-silent 0"
lint_imports = "lint-imports --cache-dir build/cache/imports"

[feature.audio.pypi-dependencies]
librosa = ">=0.11.0, <0.12"
f8pyaudiofeat = { path = "extensions/f8pyaudiofeat", editable = true }

[feature.audio.tasks]
f8pyaudiofeat_core = "python -m f8pyaudiofeat.main_core"
f8pyaudiofeat_rhythm = "python -m f8pyaudiofeat.main_rhythm"

[feature.engine.pypi-dependencies]
f8diagnostics = { path = "extensions/f8diagnostics", editable = true }
scipy = ">=1.17.1,<2"
scikit-learn = ">=1.8.0,<2"
f8pyengine = { path = "extensions/f8pyengine", editable = true }
f8proclauncher = { path = "extensions/f8proclauncher", editable = true }

[feature.engine.tasks]
f8pyengine = "python -m f8pyengine.main"
f8pyscript = "python -m f8pyscript.main_script"
f8pyexpr = "python -m f8pyscript.main_expr"
f8proclauncher = "python -m f8proclauncher.main"

[feature.doc.pypi-dependencies]
zensical = ">=0.0.23,<0.1.0"
pyyaml = ">=6.0.3,<7"
mkdocs-static-i18n = ">=1.2.3,<2"

[feature.doc.tasks]
# Inventory generation uses the SDK and generated integration catalog; the doc
# environment remains dedicated to the static site renderer.
doc_gen = "pixi run --locked -e build-check workspace_catalog && pixi run --locked -e build-check python scripts/generate_service_docs.py && pixi run --locked -e build-check python scripts/generate_node_atlas.py"
doc_build = "zensical build"
doc_serve = "python scripts/zensical_serve_pretty.py"
doc_serve_raw = "zensical serve"
doc_check = "pixi run --locked -e build-check workspace_catalog && pixi run --locked -e build-check python scripts/generate_service_docs.py --check && pixi run --locked -e build-check python scripts/generate_node_atlas.py --check && python scripts/check_docs_nav.py && python scripts/check_docs_links.py"

[feature.cpp.dependencies]
pip = ">=26.0.1,<27"
conan = ">=2.23.0,<3"
cmake = ">=3.30,<5"
ninja = ">=1.13.0,<2"
pkg-config = ">=0.29,<1"
libzenohc = ">=1.9.0,<1.10"
libzenohcxx = ">=1.9.0,<1.10"
sdl3 = ">=3.2,<4"
yt-dlp = ">=2025.8,<2027"
gtest = ">=1.17.0,<2"

[feature.cpp.target.linux-64.dependencies]
gxx_linux-64 = ">=11,<12"
mpv = ">=0.39,<1"
libgl-devel = ">=1.7,<2"
libegl-devel = ">=1.7,<2"
libudev = ">=257,<261"
expat = ">=2.6,<3"
freetype = ">=2.13,<3"
zlib = ">=1.3,<2"
xorg-libx11 = ">=1.8,<2"
xorg-libxext = ">=1.3,<2"
xorg-libxfixes = ">=6,<7"
xorg-libxinerama = ">=1.1,<2"
xorg-libxrandr = ">=1.5,<2"
xorg-libxcursor = ">=1.2,<2"

[feature.cpp.tasks]
cpp_lock_refresh = "python scripts/cpp_ci.py lock-refresh"
cpp_bootstrap = "python scripts/cpp_ci.py bootstrap"
cpp_configure_release = "python scripts/cpp_ci.py configure"
cpp_build_release = "python scripts/cpp_ci.py build"
cpp_test_release = "python scripts/cpp_ci.py test"
cpp_bench_latest_video = "python scripts/cpp_ci.py configure && python scripts/cpp_ci.py run-target f8cpp_bench_latest_video_transport"

[feature.ci.dependencies]
hatchling = ">=1.28.0,<2"
msgspec = ">=0.18.6,<1"

[feature.ci.tasks]
workspace_snapshot = "python scripts/workspace_ci.py"
workspace_clean = "python scripts/workspace_clean.py"

[feature.web-studio.target.linux-64.dependencies]
pygobject = ">=3.50,<4"
gtk3 = ">=3.24,<4"

[feature.web-studio.pypi-dependencies]
f8platform = { path = "launcher", editable = true }
f8studio-core = { path = "extensions/f8webstudio/f8studio_core", editable = true }
f8media-gateway = { path = "extensions/f8mediagateway", editable = true }
f8studio-server = { path = "extensions/f8webstudio/f8studio_server", editable = true }
f8unitymods-setup = { path = "extensions/f8unitymods", editable = true }
aiortc = ">=1.14,<2"
basedpyright = ">=1.31,<2"
python-xlib = ">=0.33,<1"
httpx = ">=0.28,<1"
agent-framework-core = ">=1.7,<2"
agent-framework-openai = ">=1.7,<2"
agent-framework-anthropic = ">=1.0.0b260521,<2"
mcp = { version = ">=1.24,<2", extras = ["cli"] }

[feature.web-studio.tasks]
studio_media_gateway = "python -m f8media_gateway"
studio_server = { cmd = "python -m f8studio_server", depends-on = ["workspace_catalog"] }
studio_launch = { cmd = "python -m f8studio_server --open-browser", depends-on = ["workspace_catalog"] }
studio_cli = { cmd = "python -m f8studio_server.cli", depends-on = ["workspace_catalog"] }
studio_mcp = { cmd = "python -m f8studio_server.mcp_server", depends-on = ["workspace_catalog"] }
studio_agent_model_smoke = "python scripts/web_studio/probe_agent_model.py"
unitymods_validate = "python scripts/unitymods_ci.py validate"
unitymods_build = "python scripts/unitymods_ci.py build"
unitymods_test = "python scripts/unitymods_ci.py test"
unitymods_package = "python scripts/unitymods_ci.py package"
unitymods_contract = "python scripts/verify_skeleton_contract.py"

[feature.web-studio-dev.dependencies]
nodejs = ">=24,<25"

[feature.web-studio-dev.tasks]
studio_web_dev = "npm --prefix extensions/f8webstudio/f8studio_web run dev"
studio_web_build = "npm --prefix extensions/f8webstudio/f8studio_web run build"

[feature.web-studio-test.dependencies]
pytest = ">=8.4.2,<9"
hatchling = ">=1.28,<2"

[feature.web-studio-test.pypi-dependencies]
httpx = ">=0.28,<1"
basedpyright = ">=1.31,<2"

[feature.web-studio-test.tasks]
studio_core_test = "python -m pytest -q extensions/f8webstudio/f8studio_core/tests"
studio_server_test = "python -m pytest -q extensions/f8webstudio/f8studio_server/tests"
studio_media_gateway_test = "python -m pytest -q extensions/f8mediagateway/tests"
studio_web_test = "npm --prefix extensions/f8webstudio/f8studio_web run test"
studio_web_ci = "npm --prefix extensions/f8webstudio/f8studio_web ci && npm --prefix extensions/f8webstudio/f8studio_web run typecheck && npm --prefix extensions/f8webstudio/f8studio_web run test"
studio_web_typecheck = "npm --prefix extensions/f8webstudio/f8studio_web run typecheck"
studio_web_e2e = { cmd = "npm --prefix extensions/f8webstudio/f8studio_web run test:e2e", depends-on = ["studio_web_build"] }
studio_graph_bench = { cmd = "npm --prefix extensions/f8webstudio/f8studio_web run test:graph-performance", depends-on = ["studio_web_build"] }
studio_python_typecheck = "basedpyright -p pyrightconfig.web-studio.json"
studio_no_qt_check = "python scripts/web_studio/check_no_qt.py"
studio_dependency_probe = "python scripts/web_studio/probe_environment.py"
studio_runtime_probe = "python scripts/web_studio/probe_real_runtime.py"
studio_media_probe = "python scripts/web_studio/probe_webrtc_media.py"
studio_real_video_probe = "python scripts/web_studio/probe_real_video.py"
studio_media_bench = "python scripts/web_studio/benchmark_media.py"
studio_stream_restart_probe = "python scripts/web_studio/probe_stream_restart.py"
studio_p3_combined_bench = "python scripts/web_studio/benchmark_p3_combined.py"
studio_wheel_smoke = "python scripts/web_studio/verify_release_install.py"

# Developer and CI workspaces only. Studio uses its extension workspace;
# extensions own their runtime definitions and locks.
[environments]
build-check = { features = ["python", "sdk", "engine", "web-studio", "web-studio-dev", "web-studio-test", "vision", "audio", "test", "debug", "ci", "pydl"], solve-group = "build-check" }
# Pixi tasks are feature-scoped, not environment-scoped. If a task's feature is
# included by multiple development environments, `pixi run <task>` without
# `-e` can resolve differently
# depending on the active Pixi environment. Keep `service.yml` launch entries
# explicit with `-e` for shared runtime tasks.
default = { features = ["python", "sdk", "engine", "web-studio", "web-studio-dev", "vision", "audio", "test", "debug"], solve-group = "default" }
doc = { features = ["python", "doc"] }
cpp = { features = ["cpp"], solve-group = "cpp" }
ci = { features = ["python", "ci"], solve-group = "ci" }
web-studio = { features = ["python", "sdk", "web-studio", "web-studio-dev"], solve-group = "web-studio" }
web-studio-test = { features = ["python", "sdk", "engine", "web-studio", "web-studio-dev", "web-studio-test"], solve-group = "web-studio" }
