[workspace]
authors = ["sis92 <feel8.fun@gmail.com>"]
channels = ["conda-forge"]
name = "feel8-build"
version = "0.4.0"
description = "Feel8 meta package"
platforms = ["win-64", { name = "linux-glibc-2-34", platform = "linux-64", glibc = "2.34" }]
preview = ["pixi-build"]

[feature.python.dependencies]
python = ">=3.14.3,<3.15"
pip = ">=26.0.1,<27"

[feature.vision.pypi-dependencies]
numpy = ">=2.4.2, <3"
opencv-contrib-python = ">=4.13.0.92, <5"

[feature.debug.pypi-dependencies]
scapy = ">=2.6.1,<3"

[feature.debug.tasks]
udp_pcap_replay = "python scripts/udp_pcap_replay.py"

[feature.onnx.dependencies]
cuda-version = "12.*"
cuda-libraries = "12.*"
cudnn = ">=9,<10"

[feature.onnx.pypi-dependencies]
f8pydl = { path = "packages/f8pydl", editable = true }
onnxruntime-gpu = ">=1.24.2, <2"
pyyaml = ">=6.0.3, <7"

[feature.onnx.tasks]
f8pydl_detector = "python -m f8pydl.main_detector"
f8pydl_humandetector = "python -m f8pydl.main_humandetector"
f8pydl_classifier = "python -m f8pydl.main_classifier"
f8pydl_optflow = "python -m f8pydl.main_optflow"
f8pydl_detsorter = "python -m f8pydl.main_detsorter"
f8pydl_tcnwave = "python -m f8pydl.main_tcnwave"
f8pydl_bench = "python scripts/bench_dl_baseline.py"

[feature.sdk.pypi-dependencies]
f8pysdk = { path = "packages/f8pysdk", editable = true }
eclipse-zenoh = ">=1.9.0"

[feature.sdk.tasks]
update_describes = "python scripts/update_static_describes.py"
protocol_codegen_py = "python scripts/protocol_codegen_msgspec.py --protocol schemas/protocol.yml --output packages/f8pysdk/f8pysdk/generated/__init__.py"
protocol_codegen_cpp = "python scripts/gen_cpp_protocol_models.py --protocol schemas/protocol.yml --out packages/f8cppsdk/include/f8cppsdk/generated/protocol_models.h"
protocol_codegen_all = "python scripts/protocol_codegen_msgspec.py --protocol schemas/protocol.yml --output packages/f8pysdk/f8pysdk/generated/__init__.py && python scripts/gen_cpp_protocol_models.py --protocol schemas/protocol.yml --out packages/f8cppsdk/include/f8cppsdk/generated/protocol_models.h"

[feature.test.dependencies]
pytest = ">=8.4.2,<9"

[feature.test.pypi-dependencies]
ruff = ">=0.12.0,<0.13"
import-linter = ">=2.11,<3"

[feature.test.tasks]
pytest = "python -m pytest"
pytest_sdk = "python -m pytest -q packages/f8pysdk/tests"
pytest_studio = "python -m pytest -q packages/f8pystudio/tests"
# Keep the initial repo-level static guards narrow and green. We can widen the
# checked surface incrementally as more packages are annotated and cleaned up.
lint = "ruff check packages/f8proclauncher/f8proclauncher packages/f8pyfallendoll/f8pyfallendoll packages/f8pystudio/f8pystudio/global_hotkeys packages/f8pymppose/f8pymppose packages/f8pyscript/f8pyscript packages/f8pyaudiofeat/f8pyaudiofeat packages/f8pydl/f8pydl packages/f8pystudio_ext_viz_tcode/f8pystudio_ext_viz_tcode packages/f8pystudio_ext_template_match/f8pystudio_ext_template_match packages/f8pysdk/f8pysdk packages/f8pyengine/f8pyengine"
typecheck = "basedpyright -p pyrightconfig.json"
quality_exceptions = "python packages/f8pystudio/tools/quality/except_metrics.py packages --exclude-glob '**/tests/**' --max-broad 844 --max-silent 40"
lint_imports = "lint-imports"
official_components = "python scripts/generate_official_components.py"
official_components_check = "python scripts/generate_official_components.py --check"

[feature.audio.pypi-dependencies]
librosa = ">=0.11.0, <0.12"
f8pyaudiofeat = { path = "packages/f8pyaudiofeat", editable = true }

[feature.audio.tasks]
f8pyaudiofeat_core = "python -m f8pyaudiofeat.main_core"
f8pyaudiofeat_rhythm = "python -m f8pyaudiofeat.main_rhythm"

[feature.engine.pypi-dependencies]
scipy = ">=1.17.1,<2"
scikit-learn = ">=1.8.0,<2"
f8pyengine = { path = "packages/f8pyengine", editable = true }
f8pyscript = { path = "packages/f8pyscript", editable = true }
f8proclauncher = { path = "packages/f8proclauncher", editable = true }
f8pyfallendoll = { path = "packages/f8pyfallendoll", editable = true }

[feature.engine.tasks]
f8pyengine = "python -m f8pyengine.main"
f8pyscript = "python -m f8pyscript.main_script"
f8pyexpr = "python -m f8pyscript.main_expr"
f8proclauncher = "python -m f8proclauncher.main"
f8pyfallendoll = "python -m f8pyfallendoll.main"

[feature.studio.pypi-dependencies]
f8pystudio = { path = "packages/f8pystudio", editable = true }
f8unitymods-setup = { path = "external/f8unitymods", editable = true }
f8pystudio-ext-template-match = { path = "packages/f8pystudio_ext_template_match", editable = true }
f8pystudio-ext-viz-tcode = { path = "packages/f8pystudio_ext_viz_tcode", editable = true }
pyside6 = ">=6.10.2, <7"
qtpy = ">=2.4.3, <3"
pyqtgraph = ">=0.14.0, <0.15"
websockets = ">=16.0, <17"
aiortc = ">=1.14.0, <2"
basedpyright = ">=1.31.0, <2"
python-xlib = ">=0.33, <1"
sqlalchemy = ">=2.0.41, <3"
keyring = ">=25.6.0, <26"
mcp = { version = ">=1.18.0,<2", extras = ["cli"] }
agent-framework-core = ">=1.7.0,<2"
agent-framework-openai = ">=1.7.0,<2"
agent-framework-foundry = ">=1.7.0,<2"
agent-framework-anthropic = ">=1.0.0b260521,<2"
agent-framework-bedrock = ">=1.0.0b260521,<2"
agent-framework-ollama = ">=1.0.0b260521,<2"
agent-framework-github-copilot = ">=1.0.0,<2"
agent-framework-hyperlight = ">=1.0.0b260521,<2"
github-copilot-sdk = "==1.0.2"

[feature.studio.tasks]
f8pystudio = "python -m f8pystudio.main"
f8pystudio_cli = "python -m f8pystudio.automation.cli"
f8pystudio_mcp = "python -m f8pystudio.mcp.server"
unitymods_validate = "python scripts/unitymods_ci.py validate"
unitymods_build = "python scripts/unitymods_ci.py build"
unitymods_test = "python scripts/unitymods_ci.py test"
unitymods_package = "python scripts/unitymods_ci.py package"
unitymods_contract = "python scripts/verify_skeleton_contract.py"

[feature.mediapipe.pypi-dependencies]
f8pymppose = { path = "packages/f8pymppose", editable = true }
mediapipe = ">=0.10.32, <0.11"

[feature.mediapipe.tasks]
f8pymppose = "python -m f8pymppose.main_pose"

[feature.doc.pypi-dependencies]
zensical = ">=0.0.23,<0.1.0"
pyyaml = ">=6.0.3,<7"
mkdocs-static-i18n = ">=1.2.3,<2"

[feature.doc.tasks]
doc_gen = "python scripts/generate_service_docs.py && python scripts/generate_node_atlas.py"
doc_build = "zensical build"
doc_serve = "python scripts/zensical_serve_pretty.py"
doc_serve_raw = "zensical serve"
doc_check = "python scripts/generate_service_docs.py --check && python scripts/generate_node_atlas.py --check && python scripts/check_docs_nav.py && python scripts/check_docs_links.py"

[feature.cpp.dependencies]
pip = ">=26.0.1,<27"
conan = ">=2.23.0,<3"
cmake = ">=3.30,<5"
ninja = ">=1.13.0,<2"
pkg-config = ">=0.29,<1"
libzenohc = ">=1.9.0,<1.10"
libzenohcxx = ">=1.9.0,<1.10"
sdl3 = ">=3.2,<4"
yt-dlp = ">=2025.8,<2027"
gtest = ">=1.17.0,<2"

[feature.cpp.target.linux-64.dependencies]
gxx_linux-64 = ">=11,<12"
mpv = ">=0.39,<1"
libgl-devel = ">=1.7,<2"
libegl-devel = ">=1.7,<2"
libudev = ">=257,<261"
expat = ">=2.6,<3"
freetype = ">=2.13,<3"
zlib = ">=1.3,<2"
xorg-libx11 = ">=1.8,<2"
xorg-libxext = ">=1.3,<2"
xorg-libxfixes = ">=6,<7"
xorg-libxinerama = ">=1.1,<2"
xorg-libxrandr = ">=1.5,<2"
xorg-libxcursor = ">=1.2,<2"

[feature.cpp.tasks]
cpp_lock_refresh = "python scripts/cpp_ci.py lock-refresh"
cpp_bootstrap = "python scripts/cpp_ci.py bootstrap"
cpp_configure_release = "python scripts/cpp_ci.py configure"
cpp_build_release = "python scripts/cpp_ci.py build"
cpp_test_release = "python scripts/cpp_ci.py test"
cpp_bench_latest_video = "python scripts/cpp_ci.py configure && python scripts/cpp_ci.py build-target f8cpp_bench_latest_video_transport && build/Release/bin/f8cpp_bench_latest_video_transport"

[feature.ci.dependencies]
python = ">=3.13,<3.14"
pip = ">=26.0.1,<27"
hatchling = ">=1.28.0,<2"
msgspec = ">=0.18.6,<1"
datamodel-code-generator = ">=0.50.0,<1"

[feature.ci.tasks]
dist_ci = "python scripts/dist_ci.py"

[feature.launcher.dependencies]
python = ">=3.13,<3.14"
pip = ">=26.0.1,<27"

[feature.launcher.pypi-dependencies]
nuitka = ">=2.7.17,<3"
hatchling = ">=1.28.0,<2"

[feature.launcher.tasks]
build_studio_launcher = "python scripts/build_studio_launcher.py"

[feature.launcher-runtime]

[environments]
# Pixi tasks are feature-scoped, not environment-scoped. If a task's feature is
# included by multiple environments (for example both `default` and
# `studio-runtime`), `pixi run <task>` without `-e` can resolve differently
# depending on the active Pixi environment. Keep `service.yml` launch entries
# explicit with `-e` for shared runtime tasks.
default = { features = ["python", "sdk", "engine", "studio", "vision", "audio", "test", "debug"], solve-group = "default" }
studio-runtime = { features = ["python", "sdk", "engine", "studio", "vision", "audio", "launcher-runtime"], solve-group = "default" }
onnx = { features = ["python", "sdk", "onnx", "vision", "launcher-runtime"], solve-group = "onnx" }
mediapipe = { features = ["python", "sdk", "vision", "mediapipe", "launcher-runtime"], solve-group = "mediapipe" }
doc = { features = ["python", "doc"] }
cpp = { features = ["cpp"], solve-group = "cpp" }
ci = { features = ["ci"], solve-group = "ci" }
launcher = { features = ["launcher"], solve-group = "launcher" }
