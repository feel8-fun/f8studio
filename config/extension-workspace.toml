# Source layout only. Runtime manifests live with each extension package.
core = []
applications = ["f8webstudio", "f8mediagateway"]
preinstalled = ["audiocap", "audiofeat", "cppengine", "cvkit", "dl", "implayer", "mediapipe", "pyengine", "proclauncher", "screencap"]

[[runtimes]]
package = "platform"
environment = "platform-runtime"

[[extensions]]
package = "f8screencap"
extension_ids = ["screencap"]

[[extensions]]
package = "f8audiocap"
extension_ids = ["audiocap"]

[[extensions]]
package = "f8cvkit"
extension_ids = ["cvkit"]

[[extensions]]
package = "f8implayer"
extension_ids = ["implayer"]

[[extensions]]
package = "f8cppengine"
extension_ids = ["cppengine"]

[[extensions]]
package = "f8pyengine"
extension_ids = ["pyengine"]
python_modules = ["f8pyengine", "f8pyscript"]

[[extensions]]
package = "f8pymppose"
extension_ids = ["mediapipe"]

[[extensions]]
package = "f8pydl"
extension_ids = ["dl"]

[[extensions]]
package = "f8pyaudiofeat"
extension_ids = ["audiofeat"]

[[extensions]]
package = "f8proclauncher"
extension_ids = ["proclauncher"]

[[extensions]]
package = "f8diagnostics"
extension_ids = ["diagnostics"]

[[extensions]]
package = "f8webstudio"
extension_ids = ["webstudio"]
python_modules = []

[[extensions]]
package = "f8mediagateway"
extension_ids = ["media-gateway"]
python_modules = []
