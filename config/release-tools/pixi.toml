# Artifact assembly needs no service checkout, compiler, frontend or app installation.
[workspace]
name = "f8-release-tools"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.14.*"

[pypi-dependencies]
msgspec = ">=0.18.6"
pyyaml = ">=6.0.3,<7"
packaging = ">=25,<27"

[tasks]
assemble = "python ../../scripts/dist_ci.py"
publish-runtime = "python ../../scripts/publish_runtime.py"
