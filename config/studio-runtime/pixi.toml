# Studio application only. Extensions own their manifests and locks.
[workspace]
name = "f8studio-runtime"
channels = ["conda-forge"]
platforms = ["win-64", {name = "linux-glibc228", platform = "linux-64", glibc = "2.28"}]

[feature.python.dependencies]
python = ">=3.14.3,<3.15"
pip = ">=26.0.1,<27"

[feature.application.pypi-dependencies]
f8pysdk = {path = "../../sdk/python", editable = true}
f8studio-core = {path = "../../packages/f8studio_core", editable = true}
f8media-protocol = {path = "../../packages/f8media_protocol", editable = true}
f8media-gateway = {path = "../../packages/f8media_gateway", editable = true}
f8studio-server = {path = "../../packages/f8studio_server", editable = true}

[feature.application.target.linux-64.dependencies]
pygobject = ">=3.50,<4"
gtk3 = ">=3.24,<4"

[feature.application.tasks]
studio_server = "python -m f8studio_server"
studio_launch = "python -m f8studio_server --open-browser"
studio_media_gateway = "python -m f8media_gateway"
studio_cli = "python -m f8studio_server.cli"
studio_mcp = "python -m f8studio_server.mcp_server"

[feature.launcher-runtime]

[environments]
studio-runtime = {features = ["python", "application", "launcher-runtime"]}
