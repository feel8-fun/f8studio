openapi: "3.1.0"
info:
  title: Feel8 Schemas
  version: 1.0.0
  description: Single OpenAPI spec for multi-language model codegen and schema validation.

paths:
  /describe:
    get:
      summary: Describe service/operator/edge schemas
      responses:
        "200":
          description: OK

components:
  schemas:
    F8JsonValue:
      description: Any JSON value.
      oneOf:
        - type: string
        - type: number
        - type: integer
        - type: boolean
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: "null"
    F8VariantKind:
      title: F8VariantKind
      type: string
      enum:
        - service
        - operator
    F8VariantRef:
      title: F8VariantRef
      type: object
      properties:
        variantId:
          type: string
        kind:
          $ref: "#/components/schemas/F8VariantKind"
        baseNodeType:
          type: string
        serviceClass:
          type: string
        operatorClass:
          anyOf:
            - type: string
            - type: "null"
          default: null
        name:
          type: string
      required:
        - variantId
        - kind
        - baseNodeType
        - serviceClass
        - name
      additionalProperties: false
    F8VariantRecord:
      title: F8VariantRecord
      type: object
      properties:
        variantId:
          type: string
        kind:
          $ref: "#/components/schemas/F8VariantKind"
        baseNodeType:
          type: string
        serviceClass:
          type: string
        operatorClass:
          anyOf:
            - type: string
            - type: "null"
          default: null
        name:
          type: string
        description:
          type: string
          default: ""
        tags:
          type: array
          items:
            type: string
          default: []
        spec:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - variantId
        - kind
        - baseNodeType
        - serviceClass
        - name
        - spec
        - createdAt
        - updatedAt
      additionalProperties: false
    F8ComponentRecord:
      title: F8ComponentRecord
      type: object
      properties:
        componentId:
          type: string
        name:
          type: string
        description:
          type: string
          default: ""
        tags:
          type: array
          items:
            type: string
          default: []
        content:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
        createdAt:
          type: string
          default: ""
        updatedAt:
          type: string
          default: ""
      required:
        - componentId
        - name
        - content
      additionalProperties: false
    F8VariantLibrary:
      title: F8VariantLibrary
      type: object
      properties:
        schemaVersion:
          type: string
          enum:
            - f8variantlib/1
          default: f8variantlib/1
        entries:
          type: array
          items:
            type: object
            properties:
              record:
                $ref: "#/components/schemas/F8VariantRecord"
              localVersionNumber:
                type: integer
              syncBaseRemoteRevision:
                type: string
              syncBaseRemoteVersionNumber:
                type: integer
              syncBaseLocalVersionNumber:
                type: integer
            required:
              - record
          default: []
      additionalProperties: false
    F8NodeUiOverridePatch:
      title: F8NodeUiOverridePatch
      type: object
      properties:
        showOnNode:
          type: boolean
        uiControl:
          type: string
        label:
          type: string
        description:
          type: string
      additionalProperties: false
    F8NodeUiOverrides:
      title: F8NodeUiOverrides
      type: object
      description: Instance-level UI presentation patches only. Does not carry schema edits or interaction/session state.
      properties:
        stateFields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/F8NodeUiOverridePatch"
        commands:
          type: object
          additionalProperties:
            type: object
            properties:
              showOnNode:
                type: boolean
            additionalProperties: false
        dataPorts:
          type: object
          properties:
            in:
              type: object
              additionalProperties:
                type: object
                properties:
                  showOnNode:
                    type: boolean
                additionalProperties: false
            out:
              type: object
              additionalProperties:
                type: object
                properties:
                  showOnNode:
                    type: boolean
                additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    F8NodeUiState:
      title: F8NodeUiState
      type: object
      description: Instance/session UI interaction state. Not part of spec presentation overrides.
      properties:
        stateInlineExpanded:
          type: object
          additionalProperties:
            type: boolean
        stateFieldHotkeys:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
    F8DynamicBindingsInputsSpec:
      title: F8DynamicBindingsInputsSpec
      type: object
      properties:
        enabled:
          type: boolean
        source:
          type: string
          enum:
            - data_in_ports
        type_name:
          type: string
        module_name:
          type: string
        schema_mode:
          type: string
          enum:
            - basic_recursive
        access_mode:
          type: string
          enum:
            - object_and_mapping
      required:
        - enabled
        - source
      additionalProperties: false
    F8DynamicBindingsStatesSpec:
      title: F8DynamicBindingsStatesSpec
      type: object
      properties:
        enabled:
          type: boolean
        source:
          type: string
          enum:
            - state_fields
        type_name:
          type: string
        module_name:
          type: string
        schema_mode:
          type: string
          enum:
            - basic_recursive
        access_mode:
          type: string
          enum:
            - object_and_mapping
      required:
        - enabled
        - source
      additionalProperties: false
    F8DynamicBindingsOutputsSpec:
      title: F8DynamicBindingsOutputsSpec
      type: object
      properties:
        enabled:
          type: boolean
        source:
          type: string
          enum:
            - data_out_ports
        type_name:
          type: string
        module_name:
          type: string
        schema_mode:
          type: string
          enum:
            - basic_recursive
        access_mode:
          type: string
          enum:
            - object_and_mapping
      required:
        - enabled
        - source
      additionalProperties: false
    F8DynamicBindingsSpec:
      title: F8DynamicBindingsSpec
      type: object
      properties:
        inputs:
          $ref: "#/components/schemas/F8DynamicBindingsInputsSpec"
        states:
          $ref: "#/components/schemas/F8DynamicBindingsStatesSpec"
        outputs:
          $ref: "#/components/schemas/F8DynamicBindingsOutputsSpec"
      additionalProperties: false
    F8PythonEditorAssistSpec:
      title: F8PythonEditorAssistSpec
      type: object
      properties:
        support_files:
          type: object
          additionalProperties:
            type: string
        overlay_prefix:
          type: string
        dynamic_bindings:
          $ref: "#/components/schemas/F8DynamicBindingsSpec"
      required:
        - support_files
        - overlay_prefix
      additionalProperties: false
    F8EditorAssistSpec:
      title: F8EditorAssistSpec
      type: object
      properties:
        version:
          type: integer
        language:
          type: string
        python:
          $ref: "#/components/schemas/F8PythonEditorAssistSpec"
      required:
        - version
        - language
      additionalProperties: false
    F8StateFieldEditPolicy:
      title: F8StateFieldEditPolicy
      type: object
      description: Per-state-field edit permissions. Unset values inherit the SDK defaults for the field.
      properties:
        canRename:
          type: boolean
          description: Allow renaming this state field when its collection allows editing existing fields.
        canEditAccess:
          type: boolean
          description: Allow editing this state field's access mode when its collection allows editing existing fields.
        canEditRequired:
          type: boolean
          description: Allow editing this state field's required flag when its collection allows editing existing fields.
        canEditValueSchema:
          type: boolean
          description: Allow editing this state field's valueSchema when its collection allows editing existing fields.
      additionalProperties: false
    F8UiControlSpec:
      title: F8UiControlSpec
      type: object
      description: Declarative control presentation. Runtime graph compilation omits this metadata.
      properties:
        kind:
          title: F8UiControlKind
          type: string
          enum: [auto, text, textarea, code, toggle, slider, select, multiselect, dial, button, custom]
        optionsFromState:
          type: string
          description: State field on the same node supplying select options.
        language:
          type: string
          description: Syntax language for code or textarea controls.
        rendererKey:
          type: string
          description: Registered renderer key for custom controls.
      required:
        - kind
      additionalProperties: false
    F8StateSpec:
      title: F8StateSpec
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        description:
          type: string
        valueSchema:
          $ref: "#/components/schemas/F8DataTypeSchema"
        access:
          title: F8StateAccess
          type: string
          enum:
            - rw
            - ro
            - wo
          description: rw=mutable, ro=read-only, wo=write-only (no fanout)
        required:
          type: boolean
          default: false
          description: If true, deploy validation treats this state as required. This is not an edit lock; use editPolicy to restrict renaming, required/access edits, or valueSchema edits.
        editPolicy:
          $ref: "#/components/schemas/F8StateFieldEditPolicy"
        uiControl:
          type: string
          deprecated: true
          description: Legacy UI hint; use control.
        control:
          $ref: "#/components/schemas/F8UiControlSpec"
        showOnNode:
          type: boolean
          default: false
          description: If true, render this control inline on the node body; otherwise only in the inspector
        redactOnPublish:
          type: boolean
          default: false
          description: If true, clear this state's saved value when exporting a publish-safe session JSON.
        editorAssist:
          $ref: "#/components/schemas/F8EditorAssistSpec"
      required:
        - name
        - valueSchema
        - access
      additionalProperties: false
    F8CollectionEditPolicy:
      title: F8CollectionEditPolicy
      type: object
      properties:
        canAdd:
          type: boolean
          default: false
          description: Allow adding new items to the collection.
        canDelete:
          type: boolean
          default: false
          description: Allow deleting existing items from the collection.
        canEditExisting:
          type: boolean
          default: false
          description: Allow editing existing items without implying add/delete permission.
      additionalProperties: false
    F8SpecEditPolicy:
      title: F8SpecEditPolicy
      type: object
      properties:
        stateFields:
          $ref: "#/components/schemas/F8CollectionEditPolicy"
        commands:
          $ref: "#/components/schemas/F8CollectionEditPolicy"
        dataInPorts:
          $ref: "#/components/schemas/F8CollectionEditPolicy"
        dataOutPorts:
          $ref: "#/components/schemas/F8CollectionEditPolicy"
        execInPorts:
          $ref: "#/components/schemas/F8CollectionEditPolicy"
        execOutPorts:
          $ref: "#/components/schemas/F8CollectionEditPolicy"
      additionalProperties: false
    F8DataPortPayloadKind:
      title: F8DataPortPayloadKind
      type: string
      default: json
      enum:
        - json
        - bytes
        - video_frame
        - audio_chunk
      description: Runtime payload class. Media/binary payloads use stream transport and are not JSON-wrapped.
    F8DataPortDelivery:
      title: F8DataPortDelivery
      type: string
      default: fifo
      enum:
        - latest
        - fifo
        - reliable
      description: Preferred stream delivery policy for this data port.
    F8DataPayloadSpec:
      title: F8DataPayloadSpec
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/F8DataPortPayloadKind"
        valueSchema:
          $ref: "#/components/schemas/F8DataTypeSchema"
          description: JSON value schema for ordinary JSON data ports.
        metadataSchema:
          $ref: "#/components/schemas/F8DataTypeSchema"
          description: Decoded envelope metadata schema for binary/media payloads.
        schemaVersion:
          type: integer
          default: 1
          minimum: 1
          description: Payload envelope schema version.
        formats:
          type: array
          items:
            type: string
          default: []
          description: Optional allowed media/binary formats for this payload kind.
      required:
        - kind
      additionalProperties: false
    F8DataStreamSpec:
      title: F8DataStreamSpec
      type: object
      properties:
        delivery:
          $ref: "#/components/schemas/F8DataPortDelivery"
        reliability:
          type: string
          default: best_effort
          enum:
            - best_effort
            - reliable
          title: F8DataStreamReliability
          description: Runtime reliability preference for stream transports.
        congestion:
          type: string
          default: drop
          enum:
            - drop
            - block
          title: F8DataStreamCongestion
          description: Runtime congestion behavior preference for stream transports.
        priority:
          type: string
          default: data
          enum:
            - real_time
            - interactive
            - data
          title: F8DataStreamPriority
          description: Runtime priority preference for stream transports.
      additionalProperties: false
    F8DataPortSpec:
      title: F8DataPortSpec
      type: object
      properties:
        name:
          type: string
        valueSchema:
          $ref: "#/components/schemas/F8DataTypeSchema"
          description: Legacy-compatible schema mirror. Prefer payload.valueSchema or payload.metadataSchema for new specs.
        payload:
          $ref: "#/components/schemas/F8DataPayloadSpec"
          description: Explicit payload contract for this data port.
        stream:
          $ref: "#/components/schemas/F8DataStreamSpec"
          description: Explicit stream transport preferences for this data port.
        description:
          type: string
        required:
          type: boolean
          default: true
          description: If true, this data port is protected and cannot be deleted from editable data port lists.
        showOnNode:
          type: boolean
          default: true
          description: If true, render this port on the node body; otherwise only in the inspector.
        payloadKind:
          $ref: "#/components/schemas/F8DataPortPayloadKind"
          deprecated: true
          description: Deprecated compatibility mirror of payload.kind.
        delivery:
          $ref: "#/components/schemas/F8DataPortDelivery"
          deprecated: true
          description: Deprecated compatibility mirror of stream.delivery.
      required:
        - name
        - valueSchema
      additionalProperties: false
    F8Command:
      title: F8Command
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        required:
          type: boolean
          default: false
          description: If true, this command is protected and cannot be deleted from editable command lists.
        showOnNode:
          type: boolean
          default: false
          description: If true, render this command as a button inline on the node body.
        params:
          type: array
          items:
            $ref: "#/components/schemas/F8CommandParam"
          default: []
      required:
        - name
      additionalProperties: false
    F8CommandParam:
      title: F8CommandParam
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        valueSchema:
          $ref: "#/components/schemas/F8DataTypeSchema"
        required:
          type: boolean
          default: false
          description: If true, this parameter is required when invoking the command.
        uiControl:
          type: string
          deprecated: true
          description: Legacy UI hint; use control.
        control:
          $ref: "#/components/schemas/F8UiControlSpec"
      required:
        - name
        - valueSchema
      additionalProperties: false

    F8CommandError:
      title: F8CommandError
      type: object
      description: Standard error payload for runtime/service command calls.
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - UNKNOWN_CALL
            - INVALID_ARGS
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - TIMEOUT
            - INTERNAL
        message:
          type: string
          description: Human-readable error message (safe to display).
        details:
          type: object
          description: Optional structured details for clients and debugging.
          default: {}
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
      required:
        - code
        - message
      additionalProperties: false

    F8CommandInvokeRequest:
      title: F8CommandInvokeRequest
      type: object
      description: Request envelope for invoking a service command via req/reply.
      properties:
        reqId:
          type: string
          description: Caller-generated request id for tracing/deduplication.
        call:
          type: string
          description: Command name (typically matches F8Command.name).
        args:
          type: object
          description: Command arguments (name -> JSON value).
          default: {}
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
        meta:
          type: object
          description: Optional metadata (traceId, actor, etc.).
          default: {}
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
      required:
        - reqId
        - call
        - args
        - meta
      additionalProperties: false

    F8CommandInvokeReply:
      title: F8CommandInvokeReply
      type: object
      description: Reply envelope for a service command invocation.
      properties:
        reqId:
          type: string
          description: Echo of the request reqId when provided.
        ok:
          type: boolean
          description: Whether the call succeeded.
        result:
          $ref: "#/components/schemas/F8JsonValue"
        error:
          anyOf:
            - $ref: "#/components/schemas/F8CommandError"
            - type: "null"
          default: null
      required:
        - reqId
        - ok
        - result
        - error
      additionalProperties: false

    F8EmptyArgs:
      title: F8EmptyArgs
      type: object
      additionalProperties: false

    F8StatusRequest:
      title: F8StatusRequest
      type: object
      properties:
        reqId:
          type: string
        args:
          $ref: "#/components/schemas/F8EmptyArgs"
        meta:
          type: object
          default: {}
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
      required:
        - reqId
        - args
        - meta
      additionalProperties: false

    F8StatusReplyResult:
      title: F8StatusReplyResult
      type: object
      properties:
        serviceId:
          type: string
        serviceClass:
          type: string
        runtimeInstanceId:
          type: string
        active:
          type: boolean
        rungraphGraphId:
          type: string
          default: ""
        rungraphRevision:
          type: string
          default: ""
        rungraphFingerprint:
          type: string
          default: ""
      required:
        - serviceId
        - serviceClass
        - runtimeInstanceId
        - active
      additionalProperties: false

    F8StatusReply:
      title: F8StatusReply
      type: object
      properties:
        reqId:
          type: string
        ok:
          type: boolean
        result:
          anyOf:
            - $ref: "#/components/schemas/F8StatusReplyResult"
            - type: "null"
          default: null
        error:
          anyOf:
            - $ref: "#/components/schemas/F8CommandError"
            - type: "null"
          default: null
      required:
        - reqId
        - ok
        - result
        - error
      additionalProperties: false

    F8ActivateRequest:
      title: F8ActivateRequest
      type: object
      properties:
        reqId:
          type: string
        args:
          $ref: "#/components/schemas/F8EmptyArgs"
        meta:
          type: object
          default: {}
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
      required:
        - reqId
        - args
        - meta
      additionalProperties: false

    F8DeactivateRequest:
      title: F8DeactivateRequest
      type: object
      properties:
        reqId:
          type: string
        args:
          $ref: "#/components/schemas/F8EmptyArgs"
        meta:
          type: object
          default: {}
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
      required:
        - reqId
        - args
        - meta
      additionalProperties: false

    F8SetActiveArgs:
      title: F8SetActiveArgs
      type: object
      description: Args payload for the `set_active` service endpoint.
      properties:
        active:
          type: boolean
      required:
        - active
      additionalProperties: false

    F8SetActiveRequest:
      title: F8SetActiveRequest
      type: object
      properties:
        reqId:
          type: string
        args:
          $ref: "#/components/schemas/F8SetActiveArgs"
        meta:
          type: object
          default: {}
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
      required:
        - reqId
        - args
        - meta
      additionalProperties: false

    F8ActiveReplyResult:
      title: F8ActiveReplyResult
      type: object
      properties:
        active:
          type: boolean
      required:
        - active
      additionalProperties: false

    F8ActiveReply:
      title: F8ActiveReply
      type: object
      properties:
        reqId:
          type: string
        ok:
          type: boolean
        result:
          anyOf:
            - $ref: "#/components/schemas/F8ActiveReplyResult"
            - type: "null"
          default: null
        error:
          anyOf:
            - $ref: "#/components/schemas/F8CommandError"
            - type: "null"
          default: null
      required:
        - reqId
        - ok
        - result
        - error
      additionalProperties: false

    F8SetStateArgs:
      title: F8SetStateArgs
      type: object
      description: Args payload for the `set_state` service endpoint.
      properties:
        nodeId:
          type: string
        field:
          type: string
        value:
          $ref: "#/components/schemas/F8JsonValue"
      required:
        - nodeId
        - field
        - value
      additionalProperties: false

    F8SetStateRequest:
      title: F8SetStateRequest
      type: object
      properties:
        reqId:
          type: string
        args:
          $ref: "#/components/schemas/F8SetStateArgs"
        meta:
          type: object
          default: {}
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
      required:
        - reqId
        - args
        - meta
      additionalProperties: false

    F8SetStateReplyResult:
      title: F8SetStateReplyResult
      type: object
      properties:
        nodeId:
          type: string
        field:
          type: string
      required:
        - nodeId
        - field
      additionalProperties: false

    F8SetStateReply:
      title: F8SetStateReply
      type: object
      properties:
        reqId:
          type: string
        ok:
          type: boolean
        result:
          anyOf:
            - $ref: "#/components/schemas/F8SetStateReplyResult"
            - type: "null"
          default: null
        error:
          anyOf:
            - $ref: "#/components/schemas/F8CommandError"
            - type: "null"
          default: null
      required:
        - reqId
        - ok
        - result
        - error
      additionalProperties: false

    F8SetRungraphArgs:
      title: F8SetRungraphArgs
      type: object
      description: Args payload for the `set_rungraph` service endpoint.
      properties:
        graph:
          $ref: "#/components/schemas/F8RuntimeGraph"
      required:
        - graph
      additionalProperties: false

    F8SetRungraphRequest:
      title: F8SetRungraphRequest
      type: object
      properties:
        reqId:
          type: string
        args:
          $ref: "#/components/schemas/F8SetRungraphArgs"
        meta:
          type: object
          default: {}
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
      required:
        - reqId
        - args
        - meta
      additionalProperties: false

    F8SetRungraphReplyResult:
      title: F8SetRungraphReplyResult
      type: object
      properties:
        graphId:
          type: string
      required:
        - graphId
      additionalProperties: false

    F8SetRungraphReply:
      title: F8SetRungraphReply
      type: object
      properties:
        reqId:
          type: string
        ok:
          type: boolean
        result:
          anyOf:
            - $ref: "#/components/schemas/F8SetRungraphReplyResult"
            - type: "null"
          default: null
        error:
          anyOf:
            - $ref: "#/components/schemas/F8CommandError"
            - type: "null"
          default: null
      required:
        - reqId
        - ok
        - result
        - error
      additionalProperties: false

    F8TerminateRequest:
      title: F8TerminateRequest
      type: object
      properties:
        reqId:
          type: string
        args:
          $ref: "#/components/schemas/F8EmptyArgs"
        meta:
          type: object
          default: {}
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
      required:
        - reqId
        - args
        - meta
      additionalProperties: false

    F8TerminateReplyResult:
      title: F8TerminateReplyResult
      type: object
      properties:
        terminating:
          type: boolean
      required:
        - terminating
      additionalProperties: false

    F8TerminateReply:
      title: F8TerminateReply
      type: object
      properties:
        reqId:
          type: string
        ok:
          type: boolean
        result:
          anyOf:
            - $ref: "#/components/schemas/F8TerminateReplyResult"
            - type: "null"
          default: null
        error:
          anyOf:
            - $ref: "#/components/schemas/F8CommandError"
            - type: "null"
          default: null
      required:
        - reqId
        - ok
        - result
        - error
      additionalProperties: false
    F8DataTypeSchemaCommonMetadata:
      title: F8DataTypeSchemaCommonMetadata
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        default: {}
        examples:
          type: array
          items: {}
        $comment:
          type: string
    F8StringTypeSchema:
      title: F8StringTypeSchema
      allOf:
        - $ref: "#/components/schemas/F8DataTypeSchemaCommonMetadata"
        - type: object
          properties:
            type:
              title: F8StringTypeKind
              type: string
              const: string
              default: string
            enum:
              type: array
              items: {}
          required:
            - type
          additionalProperties: false
    F8NumberTypeSchema:
      title: F8NumberTypeSchema
      allOf:
        - $ref: "#/components/schemas/F8DataTypeSchemaCommonMetadata"
        - type: object
          properties:
            type:
              title: F8NumberTypeKind
              type: string
              const: number
              default: number
            enum:
              type: array
              items: {}
            minimum:
              type: number
              description: Optional lower bound for numeric types
            maximum:
              type: number
              description: Optional upper bound for numeric types
            exclusiveMinimum:
              type: number
              description: Exclusive lower bound for numeric types
            exclusiveMaximum:
              type: number
              description: Exclusive upper bound for numeric types
            multipleOf:
              type: number
              exclusiveMinimum: 0
              description: Optional step/increment (e.g., for sliders or spinboxes)
          required:
            - type
          additionalProperties: false
    F8IntegerTypeSchema:
      title: F8IntegerTypeSchema
      allOf:
        - $ref: "#/components/schemas/F8DataTypeSchemaCommonMetadata"
        - type: object
          properties:
            type:
              title: F8IntegerTypeKind
              type: string
              const: integer
              default: integer
            enum:
              type: array
              items: {}
            minimum:
              type: number
              description: Optional lower bound for numeric types
            maximum:
              type: number
              description: Optional upper bound for numeric types
            exclusiveMinimum:
              type: number
              description: Exclusive lower bound for numeric types
            exclusiveMaximum:
              type: number
              description: Exclusive upper bound for numeric types
            multipleOf:
              type: number
              exclusiveMinimum: 0
              description: Optional step/increment (e.g., for sliders or spinboxes)
          required:
            - type
          additionalProperties: false
    F8BooleanTypeSchema:
      title: F8BooleanTypeSchema
      allOf:
        - $ref: "#/components/schemas/F8DataTypeSchemaCommonMetadata"
        - type: object
          properties:
            type:
              title: F8BooleanTypeKind
              type: string
              const: boolean
              default: boolean
            enum:
              type: array
              items: {}
          required:
            - type
          additionalProperties: false
    F8NullTypeSchema:
      title: F8NullTypeSchema
      allOf:
        - $ref: "#/components/schemas/F8DataTypeSchemaCommonMetadata"
        - type: object
          properties:
            type:
              title: F8NullTypeKind
              type: string
              const: "null"
              default: "null"
            enum:
              type: array
              items: {}
          required:
            - type
          additionalProperties: false
    F8ComplexObjectTypeSchema:
      title: F8ComplexObjectTypeSchema
      allOf:
        - $ref: "#/components/schemas/F8DataTypeSchemaCommonMetadata"
        - type: object
          properties:
            type:
              title: F8ComplexTypeKind
              type: string
              const: object
              default: object
            properties:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/F8DataTypeSchema"
            required:
              type: array
              items:
                type: string
            additionalProperties:
              type: boolean
          required:
            - type
            - properties
          additionalProperties: false
    F8ArrayTypeSchema:
      title: F8ArrayTypeSchema
      allOf:
        - $ref: "#/components/schemas/F8DataTypeSchemaCommonMetadata"
        - type: object
          properties:
            type:
              title: F8ArrayTypeKind
              type: string
              const: array
              default: array
            items:
              $ref: "#/components/schemas/F8DataTypeSchema"
          required:
            - type
            - items
          additionalProperties: false
    F8AnyTypeSchema:
      title: F8AnyTypeSchema
      description: Wildcard type that accepts any value
      allOf:
        - $ref: "#/components/schemas/F8DataTypeSchemaCommonMetadata"
        - type: object
          properties:
            type:
              title: F8AnyTypeKind
              type: string
              const: any
              default: any
          required:
            - type
          additionalProperties: false
    F8DataTypeSchema:
      description:
        A strict JSON Schema subset for data flow systems, supporting primitive types, objects,
        arrays, and a wildcard type.
      oneOf:
        - $ref: "#/components/schemas/F8StringTypeSchema"
        - $ref: "#/components/schemas/F8NumberTypeSchema"
        - $ref: "#/components/schemas/F8IntegerTypeSchema"
        - $ref: "#/components/schemas/F8BooleanTypeSchema"
        - $ref: "#/components/schemas/F8NullTypeSchema"
        - $ref: "#/components/schemas/F8ComplexObjectTypeSchema"
        - $ref: "#/components/schemas/F8ArrayTypeSchema"
        - $ref: "#/components/schemas/F8AnyTypeSchema"
      discriminator:
        propertyName: type
        mapping:
          string: "#/components/schemas/F8StringTypeSchema"
          number: "#/components/schemas/F8NumberTypeSchema"
          integer: "#/components/schemas/F8IntegerTypeSchema"
          boolean: "#/components/schemas/F8BooleanTypeSchema"
          "null": "#/components/schemas/F8NullTypeSchema"
          object: "#/components/schemas/F8ComplexObjectTypeSchema"
          array: "#/components/schemas/F8ArrayTypeSchema"
          any: "#/components/schemas/F8AnyTypeSchema"
    F8ServiceSpec:
      title: F8ServiceSpec
      type: object
      properties:
        specKind:
          type: string
          const: service
          default: service
          description: Explicit spec kind discriminator for schema consumers.
        schemaVersion:
          title: F8ServiceSchemaVersion
          type: string
          enum:
            - f8service/1
        serviceClass:
          type: string
          description: Slash-separated id, e.g., f8/engine. Avoid dots so identifiers remain URL and key-expression friendly.
          pattern: ^[a-z0-9]+(\.[a-z0-9]+)+$
        rendererClass:
          type: string
          default: default_svc
          description: Optional custom UI renderer key for the node (e.g., realtimePlot, 3dViewer)
        version:
          type: string
          description: SemVer of the service profile
          default: 0.0.0
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        label:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
          default: []
        paletteCategory:
          type: string
          default: svc
          description: Explicit Studio palette category for this spec. Studio no longer derives categories from serviceClass or node type ids.
        hiddenInPalette:
          type: boolean
          description: If true, keep the spec registered but hide it from Studio palette and tab search surfaces.
          default: false
        stateFields:
          type: array
          items:
            $ref: "#/components/schemas/F8StateSpec"
          default: []
        editPolicy:
          $ref: "#/components/schemas/F8SpecEditPolicy"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/F8Command"
          default: []
        dataInPorts:
          type: array
          description: Data bus inputs exposed by this service (for cross-instance data pub/sub).
          items:
            $ref: "#/components/schemas/F8DataPortSpec"
          default: []
        dataOutPorts:
          type: array
          description: Data bus outputs exposed by this service.
          items:
            $ref: "#/components/schemas/F8DataPortSpec"
          default: []
        launch:
          $ref: "#/components/schemas/F8ServiceLaunchSpec"
      required:
        - specKind
        - serviceClass
        - label
      additionalProperties: true

    F8OperatorSpec:
      title: F8OperatorSpec
      type: object
      properties:
        specKind:
          type: string
          const: operator
          default: operator
          description: Explicit spec kind discriminator for schema consumers.
        schemaVersion:
          title: F8OperatorSchemaVersion
          type: string
          enum:
            - f8operator/1
        operatorClass:
          type: string
          description:
            Operator id within a service (not globally unique). Slash-separated path segments.
            Uniqueness is determined by (serviceClass, operatorClass).
          pattern: ^[a-z0-9][a-z0-9_-]*(\.[a-z0-9][a-z0-9_-]*)*$
        serviceClass:
          type: string
          description:
            Slash-separated id for the backend service this operator belongs to (e.g., f8/engine).
            Avoid dots so identifiers remain URL and key-expression friendly.
          pattern: ^[a-z0-9]+(\.[a-z0-9]+)+$
        rendererClass:
          type: string
          default: default_op
          description: Optional custom UI renderer key for this operator node (e.g., realtimePlot, 3dViewer)
        version:
          type: string
          description: SemVer of the operator profile
          default: 0.0.0
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        label:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
          default: []
        paletteCategory:
          type: string
          default: uncategorized
          description: Explicit Studio palette category for this spec. Studio no longer derives categories from serviceClass or node type ids.
        hiddenInPalette:
          type: boolean
          description: If true, keep the spec registered but hide it from Studio palette and tab search surfaces.
          default: false
        stateFields:
          type: array
          items:
            $ref: "#/components/schemas/F8StateSpec"
          default: []
        editPolicy:
          $ref: "#/components/schemas/F8SpecEditPolicy"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/F8Command"
          default: []
        execInPorts:
          type: array
          description:
            Execution inputs (can be empty for entry/pull-only nodes). Each execIn port may
            have only one incoming exec link.
          items:
            type: string
          default: []
        execOutPorts:
          type: array
          description:
            Execution outputs (can be empty for terminal/pull-only nodes). Operator logic decides
            which execOut to trigger.
          items:
            type: string
          default: []
        dataInPorts:
          type: array
          description: Data input ports (can be empty).
          items:
            $ref: "#/components/schemas/F8DataPortSpec"
          default: []
        dataOutPorts:
          type: array
          description: Data output ports (can be empty).
          items:
            $ref: "#/components/schemas/F8DataPortSpec"
          default: []
      required:
        - specKind
        - serviceClass
        - operatorClass
        - label
      additionalProperties: true

    F8Edge:
      title: F8Edge
      type: object
      properties:
        edgeId:
          type: string
          description: Stable id for an edge; must be unique within a graph.
        fromServiceId:
          type: string
          description: Source service id
        fromOperatorId:
          type: string
          description: Source operator id
        fromPort:
          type: string
          description: Source port name
        toServiceId:
          type: string
          description: Target service id
        toOperatorId:
          type: string
          description: Target operator id
        toPort:
          type: string
          description: Target port name
        kind:
          title: F8EdgeKindEnum
          type: string
          enum: [data, state, exec]
          description: "Edge kind: data bus, state bus, or execution flow"
        strategy:
          title: F8EdgeStrategyEnum
          type: string
          description: Rate-mismatch handling strategy (only relevant for cross-instance data edges)
          enum:
            - latest
            - queue
          default: latest
        queueSize:
          type: integer
          minimum: 1
          description: Optional max queue size for this edge (data)
          default: 16
        timeoutMs:
          type: integer
          minimum: 0
          description: Optional staleness timeout; drop-old beyond this age (data)
        direction:
          title: F8EdgeDirection
          type: string
          enum: [out, in]
          description:
            "For cross-instance half-edges, indicates the local side: out=local is source/from,
            in=local is target/to"
      required:
        - edgeId
        - fromServiceId
        - fromPort
        - toServiceId
        - toPort
        - kind
      additionalProperties: true

    F8ServiceEntry:
      title: F8ServiceEntry
      type: object
      description:
        Discovery entry stored in services/*/service.yml. Used by Studio to locate a service
        entrypoint and query full specs via `--describe`.
      properties:
        schemaVersion:
          title: F8ServiceEntrySchemaVersion
          type: string
          enum:
            - f8serviceEntry/1
        serviceClass:
          type: string
          description:
            Recommended stable id for caching and graph persistence. If omitted, the `--describe`
            output must provide service.serviceClass.
        label:
          type: string
          description: Optional short display name (fallback until `--describe` is available).
        version:
          type: string
          description: Optional SemVer hint (fallback until `--describe` is available).
        launch:
          $ref: "#/components/schemas/F8ServiceLaunchSpec"
        describeArgs:
          type: array
          items:
            type: string
          default:
            - --describe
          description: CLI args appended to launch for fetching specs.
        timeoutMs:
          type: integer
          default: 4000
          minimum: 100
          description: Describe subprocess timeout.
      required:
        - launch
      additionalProperties: true

    F8ServiceLaunchSpec:
      title: F8ServiceLaunchSpec
      type: object
      properties:
        command:
          type: string
          description: Executable path or name
        args:
          type: array
          items:
            type: string
          default: []
        env:
          type: object
          default: {}
          additionalProperties:
            type: string
        workdir:
          type: string
          default: ./
      required:
        - command
      additionalProperties: false

    F8ServiceDescribe:
      title: F8ServiceDescribe
      type: object
      properties:
        service:
          $ref: "#/components/schemas/F8ServiceSpec"
        operators:
          type: array
          items:
            $ref: "#/components/schemas/F8OperatorSpec"
          default: []
      required:
        - service

    F8RuntimeNode:
      title: F8RuntimeNode
      type: object
      properties:
        nodeId:
          type: string
        serviceId:
          type: string
          description: Service instance id that owns this node. For service/container nodes, `nodeId` MUST equal `serviceId`.
        serviceClass:
          type: string
          description: Service class of the node, required for all nodes.
        operatorClass:
          type: string
          description: Optional operator class for operator nodes; omitted for service nodes.
        execInPorts:
          type: array
          description: Exec input port names (control-flow).
          items:
            type: string
          default: []
        execOutPorts:
          type: array
          description: Exec output port names (control-flow).
          items:
            type: string
          default: []
        dataInPorts:
          type: array
          description: Data input ports (value schemas).
          items:
            $ref: "#/components/schemas/F8DataPortSpec"
          default: []
        dataOutPorts:
          type: array
          description: Data output ports (value schemas).
          items:
            $ref: "#/components/schemas/F8DataPortSpec"
          default: []
        stateFields:
          type: array
          description: State fields for this node (names/schemas/access).
          items:
            $ref: "#/components/schemas/F8StateSpec"
          default: []
        stateValues:
          type: object
          description: Map of state name -> value for this node's states.
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
      required: [nodeId, serviceId, serviceClass]
      additionalProperties: false

    F8AutoSampleRequest:
      title: F8AutoSampleRequest
      type: object
      description: Service-level periodic sampling request for a source output.
      properties:
        sourceNodeId:
          type: string
          description: Source runtime node id to sample.
        sourcePort:
          type: string
          description: Source output port to sample.
        intervalMs:
          type: integer
          minimum: 8
          maximum: 5000
          description: Periodic sampling interval in milliseconds.
        deliverLocal:
          type: boolean
          default: false
          description: Whether sampled values should fan out to local routed consumers.
        publishCrossService:
          type: boolean
          default: true
          description: Whether sampled values should publish onto cross-service data subjects.
      required: [sourceNodeId, sourcePort, intervalMs]
      additionalProperties: false

    F8RuntimeService:
      title: F8RuntimeService
      type: object
      description: Runtime service instance metadata included alongside compiled graphs.
      properties:
        serviceId:
          type: string
          description: Service instance id (unique within a graph deployment).
        serviceClass:
          type: string
          description: Service class for resolving specs/launchers (e.g., f8.pyengine).
        label:
          type: string
          description: Optional UI label for the service instance.
        meta:
          type: object
          default: {}
          description: Optional service instance metadata.
          additionalProperties:
            $ref: "#/components/schemas/F8JsonValue"
        autoSampleRequests:
          type: array
          description: Optional service-level periodic sampling requests.
          items:
            $ref: "#/components/schemas/F8AutoSampleRequest"
      required: [serviceId, serviceClass]
      additionalProperties: false

    F8RuntimeGraph:
      title: F8RuntimeGraph
      type: object
      description: Compiled graph artifact deployed to engines.
      properties:
        meta:
          $ref: "#/components/schemas/F8RuntimeGraphMeta"
        graphId:
          type: string
        revision:
          type: string
          description: Compiler output revision/etag.
        services:
          type: array
          description: Service instances referenced by nodes/edges.
          items:
            $ref: "#/components/schemas/F8RuntimeService"
          default: []
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/F8RuntimeNode"
          default: []
        edges:
          type: array
          items:
            $ref: "#/components/schemas/F8Edge"
          default: []
      required: [graphId, revision]
      additionalProperties: false

    F8RuntimeGraphMeta:
      title: F8RuntimeGraphMeta
      type: object
      description: Metadata for a rungraph snapshot.
      properties:
        ts:
          type: integer
          format: int64
          description: Unix timestamp (ms) when the rungraph snapshot was generated.
        source:
          type: string
          description: Optional origin label for this rungraph snapshot.
      additionalProperties: true

    F8MonitorCpu:
      title: F8MonitorCpu
      type: object
      properties:
        processPercent:
          anyOf:
            - type: number
            - type: "null"
          default: null
        systemPercent:
          anyOf:
            - type: number
            - type: "null"
          default: null
      required: [processPercent, systemPercent]
      additionalProperties: false

    F8MonitorMemory:
      title: F8MonitorMemory
      type: object
      properties:
        rssBytes:
          type: integer
          minimum: 0
          default: 0
        vmsBytes:
          type: integer
          minimum: 0
          default: 0
      required: [rssBytes, vmsBytes]
      additionalProperties: false

    F8MonitorGpu:
      title: F8MonitorGpu
      type: object
      properties:
        vendor:
          type: string
          default: ""
        deviceIndex:
          anyOf:
            - type: integer
            - type: "null"
          default: null
        utilPercent:
          anyOf:
            - type: number
            - type: "null"
          default: null
        memoryUsedBytes:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
          default: null
        memoryTotalBytes:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
          default: null
        available:
          type: boolean
          default: false
      required: [vendor, deviceIndex, utilPercent, memoryUsedBytes, memoryTotalBytes, available]
      additionalProperties: false

    F8MonitorFrame:
      title: F8MonitorFrame
      type: object
      properties:
        observed:
          type: integer
          minimum: 0
          default: 0
        processed:
          type: integer
          minimum: 0
          default: 0
        dropped:
          type: integer
          minimum: 0
          default: 0
        localOnlyEmits:
          type: integer
          minimum: 0
          default: 0
        routedCrossEmits:
          type: integer
          minimum: 0
          default: 0
        suppressedCrossPublishes:
          type: integer
          minimum: 0
          default: 0
        callbackDeliveries:
          type: integer
          minimum: 0
          default: 0
        bufferPullDeliveries:
          type: integer
          minimum: 0
          default: 0
      required:
        [
          observed,
          processed,
          dropped,
          localOnlyEmits,
          routedCrossEmits,
          suppressedCrossPublishes,
          callbackDeliveries,
          bufferPullDeliveries,
        ]
      additionalProperties: false

    F8MonitorTiming:
      title: F8MonitorTiming
      type: object
      properties:
        processMsAvg:
          anyOf:
            - type: number
            - type: "null"
          default: null
        processMsP95:
          anyOf:
            - type: number
            - type: "null"
          default: null
        waitMsAvg:
          anyOf:
            - type: number
            - type: "null"
          default: null
        waitMsP95:
          anyOf:
            - type: number
            - type: "null"
          default: null
        latencyMsAvg:
          anyOf:
            - type: number
            - type: "null"
          default: null
        latencyMsP95:
          anyOf:
            - type: number
            - type: "null"
          default: null
      required: [processMsAvg, processMsP95, waitMsAvg, waitMsP95, latencyMsAvg, latencyMsP95]
      additionalProperties: false

    F8MonitorQueue:
      title: F8MonitorQueue
      type: object
      properties:
        depth:
          type: integer
          minimum: 0
          default: 0
      required: [depth]
      additionalProperties: false

    F8MonitorError:
      title: F8MonitorError
      type: object
      properties:
        countWindow:
          type: integer
          minimum: 0
          default: 0
        lastNodeId:
          type: string
          default: ""
        lastCode:
          type: string
          default: ""
        lastMessage:
          type: string
          default: ""
        lastSeverity:
          type: string
          enum: [info, warning, error, critical]
          default: error
        lastFingerprint:
          type: string
          default: ""
        lastRepeatCount:
          type: integer
          minimum: 0
          default: 0
        lastTsMs:
          anyOf:
            - type: integer
            - type: "null"
          default: null
        currentNodeId:
          type: string
          default: ""
        currentCode:
          type: string
          default: ""
        currentMessage:
          type: string
          default: ""
        currentSeverity:
          type: string
          enum: ["", info, warning, error, critical]
          default: ""
        currentTsMs:
          anyOf:
            - type: integer
            - type: "null"
          default: null
      required:
        - countWindow
        - lastNodeId
        - lastCode
        - lastMessage
        - lastSeverity
        - lastFingerprint
        - lastRepeatCount
        - lastTsMs
        - currentNodeId
        - currentCode
        - currentMessage
        - currentSeverity
        - currentTsMs
      additionalProperties: false

    F8MonitorSnapshot:
      title: F8MonitorSnapshot
      type: object
      properties:
        schemaVersion:
          type: string
          enum: [f8monitor/1]
        serviceId:
          type: string
        serviceClass:
          type: string
        nodeId:
          type: string
        tsMs:
          type: integer
          format: int64
        alive:
          type: boolean
        ready:
          type: boolean
        active:
          type: boolean
        uptimeMs:
          type: integer
          minimum: 0
        cpu:
          $ref: "#/components/schemas/F8MonitorCpu"
        memory:
          $ref: "#/components/schemas/F8MonitorMemory"
        gpu:
          $ref: "#/components/schemas/F8MonitorGpu"
        frame:
          $ref: "#/components/schemas/F8MonitorFrame"
        timing:
          $ref: "#/components/schemas/F8MonitorTiming"
        queue:
          $ref: "#/components/schemas/F8MonitorQueue"
        error:
          $ref: "#/components/schemas/F8MonitorError"
      required:
        - schemaVersion
        - serviceId
        - serviceClass
        - nodeId
        - tsMs
        - alive
        - ready
        - active
        - uptimeMs
        - cpu
        - memory
        - gpu
        - frame
        - timing
        - queue
        - error
      additionalProperties: false

    F8MonitorHotspotEntry:
      title: F8MonitorHotspotEntry
      type: object
      properties:
        serviceId:
          type: string
        value:
          type: number
      required: [serviceId, value]
      additionalProperties: false

    F8MonitorErrorSummary:
      title: F8MonitorErrorSummary
      type: object
      properties:
        serviceId:
          type: string
        count:
          type: integer
          minimum: 0
        lastCode:
          type: string
        lastMessage:
          type: string
        lastTsMs:
          anyOf:
            - type: integer
            - type: "null"
          default: null
      required: [serviceId, count, lastCode, lastMessage, lastTsMs]
      additionalProperties: false

    F8MonitorServiceSummary:
      title: F8MonitorServiceSummary
      type: object
      properties:
        serviceId:
          type: string
        serviceClass:
          type: string
        alive:
          type: boolean
        ready:
          type: boolean
        active:
          type: boolean
        latest:
          $ref: "#/components/schemas/F8MonitorSnapshot"
      required: [serviceId, serviceClass, alive, ready, active, latest]
      additionalProperties: false

    F8MonitorHotspots:
      title: F8MonitorHotspots
      type: object
      properties:
        cpuTop:
