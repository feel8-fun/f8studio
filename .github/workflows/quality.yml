name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debounce:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Configure Settings > Environments > quality-debounce > Wait timer = 720.
    # GitHub waits before assigning a runner; a new push cancels this entire run.
    environment: quality-debounce
    steps:
      - run: echo "The 12-hour quiet period has elapsed."
  python:
    needs: debounce
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.debounce.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Prepare workspace library checkouts
        run: python scripts/workspace_inputs.py prepare
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          # Keep the CLI aligned with the committed v7 lock and local validation.
          pixi-version: v0.81.0
          environments: build-check
          cache: true
      - run: pixi run --locked -e build-check pytest -q
      - run: pixi run --locked -e build-check python scripts/extension_workspace.py check
      - run: pixi run --locked -e build-check extensions_check
      - run: pixi run --locked -e build-check typecheck
      - run: pixi run --locked -e build-check python scripts/web_studio/generate_contracts.py --check
      - run: pixi run --locked -e build-check lint
      - run: pixi run --locked -e build-check lint_imports
      - run: pixi run --locked -e build-check quality_exceptions
  web:
    needs: debounce
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.debounce.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Prepare workspace library checkouts
        run: python scripts/workspace_inputs.py prepare
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          # Keep the CLI aligned with the committed v7 lock and local validation.
          pixi-version: v0.81.0
          environments: build-check
          cache: true
      - name: Validate Web (same command as local)
        run: pixi run --locked -e build-check studio_web_ci

  wheel-installation:
    needs: debounce
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.debounce.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Prepare workspace library checkouts
        run: python scripts/workspace_inputs.py prepare
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          # Keep the CLI aligned with the committed v7 lock and local validation.
          pixi-version: v0.81.0
          environments: build-check
          cache: true
      - run: pixi run --locked -e build-check studio_wheel_smoke
