name: dist-windows

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      job_mode:
        description: Which job to run
        required: false
        default: build
        type: choice
        options:
          - build
          - warm-caches
      git_ref:
        description: Optional checkout override; leave empty to build the selected workflow ref
        required: false
        default: ""
        type: string
      release_tag:
        description: Release tag to upload the archive to (optional)
        required: false
        default: ""
        type: string
      upload_release:
        description: Upload archive to GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  warm-windows-build-caches:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.job_mode == 'warm-caches')
    runs-on: windows-2022
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          submodules: recursive

      - name: Record build source
        id: source
        shell: pwsh
        run: |
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to resolve checkout commit" }
          "sha=$sourceCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building checkout commit: $sourceCommit"
          git log -1 --format="%h %s"

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      # Own the cache lifecycle: persist environments before any build can fail.
      - name: Restore Pixi environments
        id: pixi_cache
        uses: actions/cache/restore@v5
        with:
          path: .pixi
          key: pixi-dist-v2-all-${{ runner.os }}-0.81.0-${{ hashFiles('pixi.lock') }}-${{ github.workspace }}

      - name: Install locked build and service environments
        run: pixi install --locked --all

      - name: Save Pixi environments
        if: success() && steps.pixi_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .pixi
          key: ${{ steps.pixi_cache.outputs.cache-primary-key }}

      - name: Check Python service descriptions before native compilation
        run: pixi run --frozen --no-install -e studio-runtime install_services --refresh --python-only --no-install

      - name: Setup MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallPath) {
            throw "Visual Studio with MSVC x64 tools was not found."
          }

          $vsDevCmd = Join-Path $vsInstallPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat was not found: $vsDevCmd"
          }

          cmd /s /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") {
                $name = $matches[1]
                $value = $matches[2]
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }

      # Tag-scoped caches cannot be restored by other tag runs, so keep the
      # canonical Windows build caches warm on the default branch instead.
      - name: Restore Conan cache
        id: conan_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-Windows-${{ hashFiles('conanfile.py', 'conan_recipes/**', 'conan.lock') }}
          restore-keys: |
            conan-Windows-${{ hashFiles('conanfile.py', 'conan_recipes/**', 'conan.lock') }}-
            conan-Windows-

      - name: Check pixi lockfile
        run: pixi lock --check

      - name: Warm Conan cache
        run: pixi run --frozen -e cpp cpp_bootstrap

      - name: Save Conan cache
        if: success() && steps.conan_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-Windows-${{ hashFiles('conanfile.py', 'conan_recipes/**', 'conan.lock') }}

  build-windows-dist:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.job_mode == 'build')
    runs-on: windows-2022
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          submodules: recursive

      - name: Record build source
        id: source
        shell: pwsh
        run: |
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to resolve checkout commit" }
          "sha=$sourceCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building checkout commit: $sourceCommit"
          git log -1 --format="%h %s"

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      # Own the cache lifecycle: persist environments before any build can fail.
      - name: Restore Pixi environments
        id: pixi_cache
        uses: actions/cache/restore@v5
        with:
          path: .pixi
          key: pixi-dist-v2-all-${{ runner.os }}-0.81.0-${{ hashFiles('pixi.lock') }}-${{ github.workspace }}

      - name: Install locked build and service environments
        run: pixi install --locked --all

      - name: Save Pixi environments
        if: success() && steps.pixi_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .pixi
          key: ${{ steps.pixi_cache.outputs.cache-primary-key }}

      - name: Check Python service descriptions before native compilation
        run: pixi run --frozen --no-install -e studio-runtime install_services --refresh --python-only --no-install

      - name: Setup MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallPath) {
            throw "Visual Studio with MSVC x64 tools was not found."
          }

          $vsDevCmd = Join-Path $vsInstallPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat was not found: $vsDevCmd"
          }

          cmd /s /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") {
                $name = $matches[1]
                $value = $matches[2]
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }

      - name: Restore Conan cache
        id: conan_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-Windows-${{ hashFiles('conanfile.py', 'conan_recipes/**', 'conan.lock') }}
          restore-keys: |
            conan-Windows-${{ hashFiles('conanfile.py', 'conan_recipes/**', 'conan.lock') }}-
            conan-Windows-

      - name: Check pixi lockfile
        run: pixi lock --check

      # Save dependencies before application build/package steps can fail.
      - name: Prepare Conan dependencies
        run: pixi run --frozen -e cpp cpp_bootstrap

      - name: Save Conan cache
        if: success() && steps.conan_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: ${{ steps.conan_cache.outputs.cache-primary-key }}

      - name: Validate pinned Unity modding submodule
        run: pixi run --frozen -e studio-runtime unitymods_validate

      - name: Test Unity modding installer
        run: pixi run --frozen -e studio-runtime unitymods_test

      - name: Verify Unity skeleton protocol contract
        run: pixi run --frozen -e studio-runtime unitymods_contract

      - name: Build Unity installer and exporter assets
        run: pixi run --frozen -e studio-runtime unitymods_package

      - name: Build runtime distribution
        run: pixi run --frozen -e ci dist_ci --archive --reuse-unitymods-assets

      - name: Validate freshly built C++ service contracts
        run: pixi run --frozen python scripts/quality/check_cpp_contracts.py --bin-dir build/Release/bin

      - name: Verify relocated release installation
        run: pixi run --frozen -e ci python scripts/verify_dist.py build/dist/f8studio-windows-x86_64.zip

      - name: Resolve release target
        id: release_target
        shell: pwsh
        env:
          MANUAL_GIT_REF: ${{ inputs.git_ref || '' }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          MANUAL_UPLOAD_RELEASE: ${{ inputs.upload_release && 'true' || 'false' }}
        run: |
          $releaseTag = ""
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          elseif ($env:MANUAL_RELEASE_TAG -ne "") {
            $releaseTag = $env:MANUAL_RELEASE_TAG.Trim()
          }
          elseif ($env:MANUAL_GIT_REF -like "refs/tags/*") {
            $releaseTag = $env:MANUAL_GIT_REF.Substring(10)
          }
          elseif ($env:MANUAL_GIT_REF -match "^v[0-9A-Za-z._-]*$") {
            $releaseTag = $env:MANUAL_GIT_REF.Trim()
          }

          $shouldUpload = "false"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $shouldUpload = "true"
          }
          elseif ($env:MANUAL_UPLOAD_RELEASE -eq "true" -and $releaseTag -ne "") {
            $shouldUpload = "true"
          }

          "tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "should_upload=$shouldUpload" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve build version
        id: version
        shell: pwsh
        env:
          MANUAL_GIT_REF: ${{ inputs.git_ref || '' }}
          RELEASE_TAG: ${{ steps.release_target.outputs.tag }}
          CHECKOUT_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          }
          elseif ($env:RELEASE_TAG -ne "") {
            $version = $env:RELEASE_TAG
          }
          elseif ($env:MANUAL_GIT_REF -like "refs/tags/*") {
            $version = $env:MANUAL_GIT_REF.Substring(10)
          }
          else {
            $version = $env:CHECKOUT_SHA.Substring(0, 7)
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: f8studio-windows-${{ steps.version.outputs.value }}
          path: |
            build/dist/f8studio-windows-x86_64
            build/dist/f8studio-windows-x86_64.zip

      - name: Attach archive to GitHub Release
        if: steps.release_target.outputs.should_upload == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_target.outputs.tag }}
          generate_release_notes: true
          files: build/dist/f8studio-windows-x86_64.zip
