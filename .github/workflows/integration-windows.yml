name: Windows workspace integration
on:
  workflow_dispatch:
  pull_request:
jobs:
  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: python scripts/workspace_inputs.py prepare
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.81.0
          environments: build-check
      - run: pixi run --locked -e build-check pytest -q
      - run: pixi run --locked -e build-check studio_web_ci
      - run: pixi run --locked -e build-check typecheck
      - run: pixi run --locked -e build-check studio_wheel_smoke
