name: assemble-release

on:
  workflow_dispatch:
    inputs:
      release_lock:
        description: Repository path to a reviewed f8studioRelease/1 lock
        required: true
        type: string
      platform:
        description: Target platform of the release lock
        required: true
        default: linux-x86_64
        type: choice
        options:
          - linux-x86_64
          - windows-x86_64

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ${{ inputs.platform == 'windows-x86_64' && 'windows-2025' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Only the SDK contract source is needed, never extension service sources.
          submodules: false
      - name: Checkout SDK contracts
        run: git submodule update --init sdk
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.81.0
          manifest-path: config/release-tools/pixi.toml
          cache: true
      - name: Assemble verified publisher artifacts
        shell: pwsh
        env:
          F8_RELEASE_LOCK: ${{ inputs.release_lock }}
        run: pixi run --locked --manifest-path config/release-tools/pixi.toml python scripts/dist_ci.py --release-lock "$env:F8_RELEASE_LOCK" --archive
      - name: Verify relocated offline runtime
        shell: pwsh
        env:
          F8_RELEASE_PLATFORM: ${{ inputs.platform }}
        run: |
          $suffix = if ($IsWindows) { 'zip' } else { 'tar.gz' }
          pixi run --locked --manifest-path config/release-tools/pixi.toml python scripts/verify_dist.py "build/dist/f8studio-$env:F8_RELEASE_PLATFORM.$suffix"
      - uses: actions/upload-artifact@v4
        with:
          name: f8studio-${{ inputs.platform }}
          path: build/dist/f8studio-${{ inputs.platform }}.*
          if-no-files-found: error
