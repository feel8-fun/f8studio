[project]
name = "f8proclauncher"
version = "0.1.1"
description = "External process launcher service for Feel8."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "f8pysdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f8proclauncher"]

[tool.uv]
package = true

