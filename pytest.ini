[pytest]
cache_dir = build/cache/pytest
testpaths =
    tests
    platform/tests
    extensions/f8webstudio/f8studio_core/tests
    extensions/f8webstudio/f8studio_server/tests
    extensions/f8mediagateway/tests
norecursedirs =
    tmp
    .tmp
    build
filterwarnings =
    ignore:distutils Version classes are deprecated\. Use packaging\.version instead\.:DeprecationWarning
