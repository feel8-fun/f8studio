[project]
name = "f8pysdk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "msgspec>=0.18.6",
    "eclipse-zenoh>=1.9.0,<1.10",
    "msgpack>=1.0",
    "pyyaml>=6.0.3,<7",
]

[build-system]
requires = ["hatchling", "datamodel-code-generator[ruff]>=0.50.0", "msgspec>=0.18.6"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["f8pysdk"]

[tool.hatch.build.hooks.custom]
path = "build_hooks.py"

[tool.uv]
package = true
