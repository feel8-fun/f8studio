[project]
name = "f8pyfallendoll"
version = "0.1.0"
description = "Fallen Doll skeleton source service for Feel8 Studio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["f8pysdk"]

[project.scripts]
f8pyfallendoll = "f8pyfallendoll.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f8pyfallendoll"]

[tool.uv]
package = true
