[project]
name = "f8studio-core"
version = "0.1.0"
description = "Qt-free domain contracts for Feel8 Web Studio."
requires-python = ">=3.14,<3.15"
dependencies = ["f8pysdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f8studio_core"]

[tool.uv]
package = true
