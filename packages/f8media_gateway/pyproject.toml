[project]
name = "f8media-gateway"
version = "0.1.0"
description = "Process-isolated Zenoh to WebRTC media gateway for Feel8 Studio."
requires-python = ">=3.14,<3.15"
dependencies = [
    "f8pysdk",
    "f8media-protocol",
    "aiortc>=1.14,<2",
    "fastapi>=0.120,<1",
    "msgspec>=0.18.6,<1",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f8media_gateway"]

[tool.uv]
package = true
