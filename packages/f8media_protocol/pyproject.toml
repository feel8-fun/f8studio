[project]
name = "f8media-protocol"
version = "0.1.0"
description = "Typed control-plane contract and client for the Feel8 Media Gateway."
requires-python = ">=3.14,<3.15"
dependencies = [
    "f8pysdk",
    "httpx>=0.28,<1",
    "msgspec>=0.18.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f8media_protocol"]

[tool.uv]
package = true
